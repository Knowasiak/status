# Knowasiak status page (Upptime): https://knowasiak.github.io/status
# Each site is checked every 5 minutes from GitHub's servers. A failed
# check opens an issue in this repository (assigned below), which is what
# the status page shows as an incident; it closes itself when the site is
# back. Docs: https://upptime.js.org/docs/configuration
owner: Knowasiak
repo: status

sites:
  - name: Website
    url: https://knowasiak.com
  - name: Explore
    url: https://knowasiak.com/explore
  # The app and its database (answers 200 only when the database responds).
  # Turn on once health.php is live on the site:
  # - name: App and database
  #   url: https://knowasiak.com/health.php

assignees:
  - Knowasiak

status-website:
  baseUrl: /status
  logoUrl: https://knowasiak.com/themes/default/statics/img/logo.png
  name: Knowasiak Status
  introTitle: "Is Knowasiak working?"
  introMessage: "Checked every 5 minutes from outside the site. When a check fails it shows here as an incident until the site answers again."
  navbar:
    - title: Status
      href: /
    - title: Knowasiak
      href: https://knowasiak.com
